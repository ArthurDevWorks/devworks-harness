<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RALPH · DEVWORKS</title>
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <main class="shell">
    <header><p class="eyebrow">DEVWORKS</p><h1>RALPH <span>MONITOR</span></h1></header>
    <div id="notice" class="notice" role="status">Carregando estado do Ralph…</div>
    <section class="toolbar" aria-label="Execução exibida"><label for="runs">Execução</label><select id="runs"><option>Carregando…</option></select><button id="stop-run" type="button" class="btn-danger" style="display:none" title="Encerrar a execução ativa do Ralph">Encerrar Ralph</button><span id="updated" class="muted"></span></section>
    <section class="panel controls" aria-label="Configuração e execução">
      <h2>CONFIGURAÇÃO E EXECUÇÃO</h2>
      <label>Engine <select id="engine"><option value="codex">Codex</option><option value="claude">Claude</option><option value="opencode">OpenCode</option><option value="antigravity">Antigravity</option></select></label>
      <label>Modelo de implementação <input id="implementation-model" maxlength="160" placeholder="Padrão da CLI"></label>
      <label>Modelo de verificação <input id="verification-model" maxlength="160" placeholder="Padrão da CLI"></label>
      <label>Limite implementação (min) <input id="implementation-limit" type="number" min="0" max="240" value="30"></label>
      <label>Limite verificação (min) <input id="verification-limit" type="number" min="0" max="240" value="5"></label>
      <label>Aviso sem saída (min) <input id="idle-limit" type="number" min="0" max="240" value="5"></label>
      <label>PHASES.md <select id="input"><option value="">Selecione um input</option></select></label>
      <button id="save-config" type="button">Salvar configuração</button><button id="start-run" type="button">Iniciar / retomar</button>
    </section>
    <div class="workspace">
      <div class="monitor-column">
        <section id="summary" class="summary" aria-live="polite"></section>
        <section class="cards"><article class="panel"><h2>PROGRESSO</h2><div id="progress"></div></article><article class="panel"><h2>TRABALHO ATUAL</h2><dl id="current"></dl></article></section>
        <section class="panel table-panel"><h2>FASES E TASKS</h2><div class="table-scroll"><table><thead><tr><th>ID</th><th>Fase / Task</th><th>Status</th><th>Tentativa</th><th>Gates</th></tr></thead><tbody id="tasks"></tbody></table></div></section>
      </div>
      <aside class="panel logs" aria-label="Logs da execução">
        <div class="logs-header">
          <div>
            <p class="section-kicker">SAÍDA EM TEMPO REAL</p>
            <h2>LOGS RECENTES</h2>
          </div>
          <div class="log-actions">
            <button id="follow-logs" class="active" type="button" aria-pressed="true">Seguindo</button>
            <button id="jump-logs" type="button">Ir ao fim</button>
          </div>
        </div>
        <p id="log-status" class="log-status" role="status">Seguindo novas linhas</p>
        <pre id="logs" aria-label="Conteúdo dos logs">Aguardando logs…</pre>
      </aside>
    </div>
  </main>
  <script src="app.js"></script>
</body>
</html>
